<svg width="1600" height="520" viewBox="0 0 1600 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Eseosa Raymond Iyangbe — Cloud and DevOps Engineering</title>
  <desc id="desc">Dark professional GitHub profile banner for cloud, DevOps, Kubernetes, GitOps, observability, and secure infrastructure.</desc>
  <defs>
